name: todoos
description: Toofty brushing helper app.
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.0.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  video_player: ^2.10.0
  audioplayers: ^6.5.1
  confetti: ^0.8.0
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  wakelock_plus: ^1.3.2
  firebase_core: ^3.15.0
  firebase_auth: ^5.6.0
  google_sign_in: ^6.3.0
  cloud_firestore: ^5.6.12
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#D1EFFF"
  adaptive_icon_foreground: assets/images/app_icon.png
  remove_alpha_ios: true

flutter_native_splash:
  background_image: assets/images/splash.png
  background_image_android: assets/images/splash.png
  background_image_ios: assets/images/splash.png
  fullscreen: true
  android_12:
    image: assets/images/splash.png
    color: "#D1EFFF"

flutter:
  uses-material-design: true
  assets:
    - assets/images/splash.png
    - assets/images/app_icon.png
    - assets/videos/splash.mp4
    - assets/images/blue/
    - assets/images/pink/
    - assets/videos/blue/
    - assets/videos/pink/
    - assets/music/blue/
    - assets/music/pink/
